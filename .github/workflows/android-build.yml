name: android-build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generar gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Ejecutar pruebas unitarias (motores de física y Room)
        run: ./gradlew test --stacktrace

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK de depuración como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FisicaLab-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Subir reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: app/build/reports/tests/
